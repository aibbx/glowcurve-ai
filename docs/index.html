<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowCurve AI — Your beauty, tracked</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FFF5F9, #F3E8FF);
            min-height: 100vh;
            color: #2D1B33;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 60px 24px;
            text-align: center;
        }
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            background: linear-gradient(135deg, #FF6B9D, #C44DFF);
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            font-weight: 700;
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 18px;
            color: #8B7394;
            margin-bottom: 40px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        .links a {
            display: block;
            width: 100%;
            max-width: 320px;
            padding: 16px 24px;
            background: white;
            border-radius: 16px;
            text-decoration: none;
            color: #2D1B33;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .links a:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .links a span {
            color: #8B7394;
            font-weight: 400;
            font-size: 14px;
            display: block;
            margin-top: 4px;
        }
        footer {
            margin-top: 60px;
            font-size: 14px;
            color: #8B7394;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">G</div>
        <h1>GlowCurve AI</h1>
        <p class="subtitle">Your beauty, tracked</p>

        <div class="links">
            <a href="privacy.html">
                Privacy Policy
                <span>How we handle your data</span>
            </a>
            <a href="terms.html">
                Terms of Use
                <span>User agreement &amp; guidelines</span>
            </a>
        </div>

        <footer>
            &copy; 2025 GlowCurve AI. All rights reserved.
        </footer>
    </div>
</body>
</html>
